name: Deploy portfolio demo

on:
  push:
    branches:
      - main
    paths:
      - "portfolio-demo/**"
      - ".github/workflows/portfolio-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: portfolio-demo

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
