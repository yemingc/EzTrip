name: eztrip

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eztrip}
      POSTGRES_USER: ${POSTGRES_USER:-eztrip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eztrip-local-only}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - eztrip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  eztrip_postgres_data:
